name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: demo/package-lock.json

      - name: Install Library & Demo Dependencies
        run: |
          npm install
          cd demo && npm install

      - name: Build Library
        run: npm run build

      - name: Build Demo
        run: cd demo && npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: demo/dist/demo
          branch: gh-pages
